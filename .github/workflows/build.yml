name: Build Raheeq Mobile App (Android APK & iOS)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK & AppBundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android APK (Release)
        run: flutter build apk --release

      - name: Build Android App Bundle (Google Play)
        run: flutter build appbundle --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Raheeq-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Android Bundle
        uses: actions/upload-artifact@v4
        with:
          name: Raheeq-Android-AAB
          path: build/app/outputs/bundle/release/app-release.aab

  build-ios:
    name: Build iOS Application
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS (No Codesign)
        run: flutter build ios --release --no-codesign

      - name: Compress iOS App
        run: |
          cd build/ios/iphoneos
          tar -czf Raheeq-iOS-App.tar.gz Runner.app

      - name: Upload iOS App Build
        uses: actions/upload-artifact@v4
        with:
          name: Raheeq-iOS-Release
          path: build/ios/iphoneos/Raheeq-iOS-App.tar.gz

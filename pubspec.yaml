name: raheeq_app
description: "Raheeq - A minimalist, serene daily worship, prayer and adhkar tracking mobile app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Persistence
  shared_preferences: ^2.3.2

  # Authentication
  google_sign_in: ^6.2.1

  # External Links (Instagram, etc.)
  url_launcher: ^6.3.0

  # Visual Indicators
  percent_indicator: ^4.2.3

  # Typography
  google_fonts: ^6.2.1

  # Localization & Dates
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/data/
